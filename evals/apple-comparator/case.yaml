schema_version: "1.1"
name: apple-comparator
description: For an Apple-platform UI feature, the system app (Photos) is the behaviour comparator and the Human Interface Guidelines are the spec; performance rules (no main-thread loads, preload neighbours, instant after gesture) are part of the feature; tests come first.
tags: [apple, ux, performance, tdd]
runs: 2
expected_outcome: Names Apple Photos as the comparator and specifies the viewer against it (tap zooms into the photo from its grid cell, swipe left/right, pinch closed returns to the grid landing on the cell), applies the HIG for controls, preloads neighbours and keeps loads off the main thread so the photo is instant after a swipe, and lists failing tests first. No questions about the interaction model, since the system app defines it.
execution:
  max_turns: 8
  allowed_tools: [Skill]
  prompt: |
    photo viewer for the coldroll ios app (package Packages/PhotoGrid): tap a
    photo opens it, swipe left and right, pinch closed goes back to the grid.
    after swipe the photo must be instant. tdd, caveman ultra.
    This session has no shell and no repo access: write the spec and the first
    failing tests inline.
graders:
  - name: photos-is-the-comparator
    type: llm
    weight: 3
    criteria: |
      PASS if the spec names Apple's Photos app as the behaviour reference and
      matches it on the three core gestures: tap opens the photo from its grid
      cell (a zoom/hero transition, not a sheet from the bottom), swipe
      navigates between neighbours, pinch closed returns to the grid landing on
      that photo's cell. Mentioning the Human Interface Guidelines, Photos'
      control placement or its thumbnail strip is a plus, not required.
      FAIL if it invents a different interaction model, asks the user to
      describe the desired gestures instead of taking them from Photos, or
      never names Photos.
  - name: performance-and-tests
    type: llm
    weight: 2
    criteria: |
      PASS if ALL hold: (1) neighbouring photos are preloaded and image loads
      stay off the main thread so the image is instant after a swipe; (2) the
      response lists failing tests to write first (gesture/state tests, preload
      test); (3) no pleasantries or hedging (caveman ultra); spec and test
      listings do not count as verbosity.
      FAIL if preload/threading is absent, tests come after implementation, or
      the prose is padded with conversational paragraphs.
