schema_version: "1.1"
name: wave-end-verification
description: With a multi-task wave the suite runs ONCE on the build box after the whole wave and the review happens once at the end, by a model that did not implement - never a suite run or review per task unless asked.
tags: [orchestration, testing, cost]
runs: 2
expected_outcome: Dispatches the six tasks to Sonnet implementers with failing tests written first (one RED run on the build box before implementation is fine), the orchestrator only reads each diff for scope between tasks, then the full suite runs on the build box after all tasks land, then ONE review of the whole branch by a non-implementing model, then fix-until-green. No suite run after individual tasks, no review agent per task.
execution:
  max_turns: 8
  allowed_tools: [Skill]
  prompt: |
    plan at docs/plans/2026-11-04-delete-consolidation.md has 6 tasks. execute
    all, subagent-driven, sonnet agents, tdd. no per-task test runs or reviews,
    review and test run after implementation finishes, then fix until green.
    caveman ultra.
    This session has no shell: write the execution plan - who implements on
    which model, when suites run and where, when the review happens and by whom.
graders:
  - name: one-run-one-review
    type: llm
    weight: 3
    criteria: |
      PASS if ALL hold: (1) implementation is delegated to Sonnet-model agents,
      one per task or sequential, not done inline; (2) the full suite runs
      after all six tasks are implemented, on the build box ("build box", "mac
      mini", anyjob/minijob/testq), not after individual tasks and not on the
      local machine; one RED run of the new tests before implementation
      (trust-the-red) is fine; (3) the review of the whole branch happens once
      at the end, by a model that did not implement; the orchestrator reading
      each task's diff for scope between dispatches is not a review and is
      fine; (4) tests are still written first (failing tests per task).
      FAIL if: it runs the suite after individual tasks, dispatches a review
      agent after individual tasks, runs tests on the dev machine, has the
      implementer review its own work, or drops TDD.
  - name: terse
    type: llm
    weight: 1
    criteria: |
      The user said "caveman ultra". PASS if the prose is compressed: no
      pleasantries, no hedging, no option essays, no restating the prompt;
      fragments and tables are fine, and length driven by the six tasks and
      the role/suite/review structure the prompt asked for does not count
      against it. FAIL only if it pads with explanations, hedges, or writes
      conversational paragraphs.
