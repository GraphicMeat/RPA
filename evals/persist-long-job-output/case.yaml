schema_version: "1.1"
name: persist-long-job-output
description: Multi-hour build-box jobs write their outputs to a persistent folder outside session temp storage and move each finished unit to its final folder as it ends; nothing waits in temp storage for a review step.
tags: [build-box, operations, media]
runs: 2
expected_outcome: The recordings run on the mini in a way that survives sleep and an SSH drop; every locale's recording is written to a persistent folder (not the session scratchpad or /tmp) and moved to its final folder in the same script right after that locale finishes; the morning review happens on those finished files; the run crosses midnight to completion.
execution:
  max_turns: 8
  allowed_tools: [Skill]
  prompt: |
    record the website feature clips for all 8 locales on the mini, about an
    hour each, let it run overnight, i will review tomorrow morning.
    This session has no shell: write the job plan - where outputs go, when each
    locale is published, what i will find in the morning.
graders:
  - name: persistent-and-published-per-unit
    type: llm
    weight: 3
    criteria: |
      PASS if ALL hold: (1) outputs are written to a persistent location (a
      folder under the user's home such as ~/Movies/..., a repo-adjacent work
      dir, or the box's job output dir that survives a session restart), NOT
      the session scratchpad, a session temp dir or /tmp; (2) each locale's
      finished clip is moved or copied to that final folder as soon as its
      recording ends, inside the job script, so a crash at 4am loses at most
      the clip in progress; (3) the morning review happens on those finished
      files. Publishing to the website only after his review is fine and not
      required for a PASS.
      FAIL if: outputs live in session temp storage, every clip is copied out
      only in one step at the end, or the plan is silent on where the finished
      clips land.
  - name: queue-and-overnight
    type: llm
    weight: 1
    criteria: |
      PASS if the recordings run on the build box (the mini), in a way that
      survives an SSH drop and sleep (job queue, launchd, tmux, caffeinate or
      equivalent), and the plan lets the run go past midnight to completion.
      FAIL if it runs the recordings on the local Mac, or stops or pauses the
      run at a time boundary.
