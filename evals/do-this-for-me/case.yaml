schema_version: "1.1"
name: do-this-for-me
description: >-
  A "your side" list is not final. When he answers it with "do this for me",
  every step the session's access can perform is done by the agent; only what
  needs his person (an interactive login) stays with him.
tags: [autonomy, decisions]
runs: 2
expected_outcome: >-
  Takes steps 1, 2, 3 and 5 itself (brew install, tokens generated on the box
  into the secrets file plus the deploy script over the working root key, key
  and tunnel install, preflight and worker install) and leaves only the
  interactive login of step 4 to him, with the state flags of what was done.
execution:
  max_turns: 8
  allowed_tools: [Skill]
  prompt: |
    an hour ago you wrote this:
    "Your side, in order (all in docs/RUNBOOK.md)
     1. brew install autossh
     2. on build-vps, create /etc/hub/secrets.env with three fresh random
        tokens, then run deploy/deploy-hub.sh
     3. a passphrase-less ssh key for build-vps, then scripts/install-tunnel.sh
     4. CLAUDE_CONFIG_DIR=~/.hub/claude claude login
     5. pnpm preflight until it prints 'preflight ok', then
        scripts/install-worker.sh"
    facts - this session's root ssh key for build-vps works, brew is
    installed, the repo is checked out here.
    Your side, in order (all in the runbook) do this for me
    This session has no shell, the next one has. Write the plan for it: which
    steps the agent runs itself and how, what stays with me, and why.
graders:
  - name: does-his-side
    type: llm
    weight: 3
    criteria: |
      He quoted the agent's own "your side" list and said "do this for me".
      The response is a plan for a session that has a shell. Judge who the
      plan assigns each step to; do not fail it for not having executed.
      PASS if ALL hold: (1) the agent takes steps 1, 2, 3 and 5 itself: brew
      install, creating the secrets file with generated tokens on the box and
      running the deploy script over ssh, generating the key and running the
      tunnel install, preflight and the worker install; (2) the only thing
      left to him is what needs his person: the interactive login of step 4
      (starting the command and handing him just the browser confirmation is
      fine); (3) it does not ask permission again for the steps it takes.
      FAIL if: any of steps 1, 2, 3 or 5 is handed back to him ("run these
      yourself"), it refuses
      because secrets or servers are "his side", or it asks "are you sure" /
      "shall I" before starting.
  - name: state-and-leftover
    type: llm
    weight: 1
    criteria: |
      PASS if the response gives a short exact list of what remains for him
      (the login only) and names a check for the steps the agent runs
      ('preflight ok', hub health or service status, tunnel up). FAIL if the
      leftover list is missing or no check is named at all.
