schema_version: "1.1"
name: errors-self-recover
description: Connection and service failures in a shipped app are designed to self-recover first (retry, reconnect, version handshake, recreate what is missing); what still surfaces is one human message naming what happened and what to do next, on one consolidated issue surface, never repeated alerts.
tags: [product, resilience, tdd]
runs: 2
expected_outcome: Design puts automatic recovery first (reconnect loop with backoff, daemon version handshake after rebuild, recreate a missing folder), then a single issue sheet/view with human copy (what happened + what to do), no alert spam; failing tests listed first for each path.
execution:
  max_turns: 8
  allowed_tools: [Skill]
  prompt: |
    iphone-to-mac photo app. pairing sometimes fails with "cannot reach mac".
    after i rebuild the mac app it says "background service not available" and
    reconnect does nothing. when i deleted the download folder it showed
    "connection_lost" alerts over and over. fix. tdd.
    This session has no shell: write the design and the list of failing tests
    you will write first.
graders:
  - name: recovery-first
    type: llm
    weight: 2
    criteria: |
      PASS if each of the three failures gets automatic recovery before any
      UI: pairing/connection is retried with backoff or re-discovery; the app
      detects the daemon mismatch after a rebuild and restarts or relaunches
      the service (or an equivalent version handshake); the missing download
      folder is recreated (or re-picked) automatically.
      FAIL if the fix is only better wording, or an error surfaces before a
      recovery attempt on any of the three paths.
  - name: human-copy-with-next-step
    type: llm
    weight: 1
    criteria: |
      PASS if whatever still surfaces after recovery fails is human copy that
      names what happened AND what to do next, never a raw code such as
      "connection_lost". FAIL if a surfaced error lacks a next step or shows
      a raw code.
  - name: one-issue-surface
    type: llm
    weight: 1
    criteria: |
      PASS if repeated alerts are replaced by ONE consolidated ongoing-issue
      surface (a sheet, banner or view) that updates in place. FAIL if alerts
      can still repeat, or the only change is de-duplicating alerts with no
      single surface.
  - name: tests-first
    type: llm
    weight: 1
    criteria: |
      PASS if the response lists failing tests to write first, one per recovery
      path (pairing retry, version mismatch, missing folder, no repeated alert).
      FAIL if tests are absent or planned only after implementation.
